<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#070d1c" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Tauri + React + Typescript</title>
  <style>
    :root {
      --splash-bg: #070d1c;
      --splash-text: #ffffff;
    }

    /* Splash Screen Styles - loads instantly */
    body {
      margin: 0;
      /* Background handled by App.css */
    }

    .app-splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      background-color: var(--splash-bg);
      color: var(--splash-text);
      position: fixed;
      top: 0;
      left: 0;
      z-index: 9999;
      transition: background-color 0.3s ease;
    }

    .splash-logo {
      width: 100px;
      height: 100px;
      object-fit: contain;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
        opacity: 0.8;
      }

      50% {
        transform: scale(1.1);
        opacity: 1;
        filter: drop-shadow(0 0 20px rgba(50, 100, 255, 0.4));
      }

      100% {
        transform: scale(1);
        opacity: 0.8;
      }
    }
  </style>

</head>

<body>
  <div id="root">
    <div class="app-splash">
      <img src="/logo.png" class="splash-logo" alt="Loading..." />
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    (function () {
      try {
        const savedSettings = localStorage.getItem('app_settings');
        if (savedSettings) {
          const settings = JSON.parse(savedSettings);
          if (settings.theme === 'light') {
            document.documentElement.style.setProperty('--splash-bg', '#f8fafc'); // White/Paper color
            document.documentElement.style.setProperty('--splash-text', '#0f172a');

            // Switch logo to dark version
            const logo = document.querySelector('.splash-logo');
            if (logo) logo.src = "/ast-logo-dark.png";

            // Also set meta theme color immediately
            const metaThemeColor = document.querySelector("meta[name=theme-color]");
            if (metaThemeColor) metaThemeColor.setAttribute("content", "#ffffff");
          }
        }
      } catch (e) {
        // Fallback to default (dark)
      }
    })();
  </script>
</body>

</html>
