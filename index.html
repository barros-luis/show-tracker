<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tauri + React + Typescript</title>
  <style>
    /* Splash Screen Styles - loads instantly */
    body {
      margin: 0;
      background-color: #070d1c;
    }

    .app-splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      background-color: #070d1c;
      color: white;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 9999;
    }

    .splash-logo {
      width: 100px;
      height: 100px;
      object-fit: contain;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
        opacity: 0.8;
      }

      50% {
        transform: scale(1.1);
        opacity: 1;
        filter: drop-shadow(0 0 20px rgba(50, 100, 255, 0.4));
      }

      100% {
        transform: scale(1);
        opacity: 0.8;
      }
    }
  </style>
</head>

<body>
  <div id="root">
    <div class="app-splash">
      <img src="/logo.png" class="splash-logo" alt="Loading..." />
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
